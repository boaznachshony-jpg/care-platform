# Local development only — never point this at a real environment.
# Credentials here are intentionally trivial and match .env.example's
# DATABASE_URL default; production uses managed secret storage
# (Constitution §17), never these values.
services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: caredesk
      POSTGRES_PASSWORD: caredesk
      POSTGRES_DB: caredesk_dev
    ports:
      - '5432:5432'
    volumes:
      - caredesk_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U caredesk -d caredesk_dev']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  caredesk_postgres_data:
