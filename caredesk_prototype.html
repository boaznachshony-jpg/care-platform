<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CareDesk Israel — Prototype</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.development.js" integrity="sha384-0HL/VWVbwweJfp0saUL50fXRuSABCdVeinTBoJCDXprLkJ49VI0QMWNGMRt8ebnT" crossorigin="anonymous"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.development.js" integrity="sha384-79Od0yhavbvtuP2nWl+Y6mwgs8AlknSIikYSw0+uOc65GTyH8SW7e2hCyCB303Y2" crossorigin="anonymous"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js" integrity="sha384-aGlMNK3U/x0wl4lEH5jD1PGhJlX9hApuPmIiA5gtiYCOQ1J8ejIdC0btaU/TMoBD" crossorigin="anonymous"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Arial, sans-serif; }
    body { background: #f0f4f8; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
    .phone-shell {
      width: 390px; min-height: 844px; background: #fff;
      border-radius: 40px; box-shadow: 0 20px 60px rgba(0,0,0,0.25);
      overflow: hidden; position: relative; display: flex; flex-direction: column;
    }
    .status-bar {
      background: #1a56db; color: white; padding: 12px 20px 8px;
      font-size: 12px; display: flex; justify-content: space-between;
    }
    .screen { flex: 1; overflow-y: auto; padding-bottom: 70px; background: #f8fafc; }
    .screen-header {
      background: linear-gradient(135deg, #1a56db 0%, #1e40af 100%);
      color: white; padding: 20px; text-align: center;
    }
    .screen-header h2 { font-size: 20px; font-weight: 700; }
    .screen-header p { font-size: 13px; opacity: 0.85; margin-top: 4px; }
    .card {
      background: white; border-radius: 16px; padding: 16px;
      margin: 12px 16px; box-shadow: 0 2px 8px rgba(0,0,0,0.06);
    }
    .card-title { font-size: 14px; color: #64748b; margin-bottom: 4px; }
    .card-value { font-size: 22px; font-weight: 700; color: #1e293b; }
    .card-sub { font-size: 12px; color: #94a3b8; margin-top: 2px; }
    .btn {
      display: inline-flex; align-items: center; justify-content: center;
      padding: 12px 20px; border-radius: 12px; font-size: 14px; font-weight: 600;
      border: none; cursor: pointer; transition: all 0.2s; gap: 6px;
    }
    .btn-primary { background: #1a56db; color: white; }
    .btn-primary:hover { background: #1e40af; }
    .btn-secondary { background: #f1f5f9; color: #334155; border: 1px solid #e2e8f0; }
    .btn-secondary:hover { background: #e2e8f0; }
    .btn-danger { background: #fee2e2; color: #dc2626; }
    .btn-full { width: 100%; margin: 6px 0; }
    .bottom-nav {
      position: absolute; bottom: 0; left: 0; right: 0;
      background: white; border-top: 1px solid #e2e8f0;
      display: flex; padding: 8px 0 4px;
    }
    .nav-item {
      flex: 1; display: flex; flex-direction: column; align-items: center;
      gap: 2px; cursor: pointer; padding: 4px;
      color: #94a3b8; font-size: 10px; font-weight: 500;
      transition: color 0.2s;
    }
    .nav-item.active { color: #1a56db; }
    .nav-icon { font-size: 20px; }
    .demo-banner {
      background: #fef3c7; border-bottom: 1px solid #fcd34d;
      padding: 8px 16px; text-align: center;
      font-size: 11px; color: #92400e; font-weight: 600;
    }
    .badge {
      display: inline-flex; align-items: center; padding: 3px 10px;
      border-radius: 999px; font-size: 11px; font-weight: 600;
    }
    .badge-green { background: #dcfce7; color: #16a34a; }
    .badge-yellow { background: #fef9c3; color: #ca8a04; }
    .badge-red { background: #fee2e2; color: #dc2626; }
    .badge-blue { background: #dbeafe; color: #1d4ed8; }
    .input-group { margin-bottom: 14px; }
    .input-label { font-size: 13px; color: #374151; margin-bottom: 6px; font-weight: 600; display: block; }
    .input-field {
      width: 100%; padding: 12px 14px; border: 1.5px solid #e2e8f0;
      border-radius: 10px; font-size: 14px; color: #1e293b;
      outline: none; transition: border 0.2s;
    }
    .input-field:focus { border-color: #1a56db; }
    .section-title {
      font-size: 16px; font-weight: 700; color: #1e293b;
      margin: 16px 16px 4px;
    }
    .list-item {
      background: white; padding: 14px 16px;
      border-bottom: 1px solid #f1f5f9; display: flex;
      align-items: center; gap: 12px;
    }
    .list-item:last-child { border-bottom: none; }
    .modal-overlay {
      position: fixed; inset: 0; background: rgba(0,0,0,0.5);
      display: flex; align-items: flex-end; justify-content: center;
      z-index: 100;
    }
    .modal-sheet {
      background: white; border-radius: 24px 24px 0 0;
      padding: 24px; width: 390px; max-height: 80vh; overflow-y: auto;
    }
    .modal-title { font-size: 18px; font-weight: 700; color: #1e293b; margin-bottom: 16px; }
    .rule-row {
      display: flex; align-items: flex-start; gap: 10px;
      padding: 12px 0; border-bottom: 1px solid #f1f5f9;
    }
    .rule-row:last-child { border-bottom: none; }
    .audit-table { width: 100%; border-collapse: collapse; font-size: 12px; }
    .audit-table th {
      background: #f8fafc; color: #64748b; font-weight: 600;
      padding: 8px 10px; text-align: right; border-bottom: 1px solid #e2e8f0;
    }
    .audit-table td { padding: 9px 10px; border-bottom: 1px solid #f1f5f9; color: #334155; }
    .audit-table tr:last-child td { border-bottom: none; }
    .user-row {
      display: flex; align-items: center; gap: 12px;
      padding: 14px; border-bottom: 1px solid #f1f5f9;
    }
    .user-avatar {
      width: 42px; height: 42px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 18px; background: #dbeafe; font-weight: 700;
    }
    .step-dot {
      width: 32px; height: 32px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 13px; font-weight: 700; flex-shrink: 0;
    }
  </style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">

const { useState } = React;

/* ─── DemoBanner ─── */
const DemoBanner = () => (
  <div className="demo-banner">⚡ DEMO — נתונים לדוגמה בלבד</div>
);

/* ─── BottomNav ─── */
const BottomNav = ({ active, onNavigate }) => (
  <nav className="bottom-nav">
    {[
      { id: "dashboard", icon: "🏠", label: "ראשי" },
      { id: "worker",    icon: "👤", label: "עובד" },
      { id: "payroll",   icon: "💰", label: "שכר" },
      { id: "tasks",     icon: "✅", label: "משימות" },
      { id: "settings",  icon: "⚙️", label: "הגדרות" },
    ].map(n => (
      <div key={n.id}
        className={`nav-item ${active === n.id ? "active" : ""}`}
        onClick={() => onNavigate(n.id)}>
        <span className="nav-icon">{n.icon}</span>
        {n.label}
      </div>
    ))}
  </nav>
);

/* ════════════════════════════════════════════
   LOGIN SCREEN
════════════════════════════════════════════ */
const LoginScreen = ({ onNavigate }) => {
  const [email, setEmail] = useState("rachel@example.com");
  const [pass, setPass] = useState("••••••••");

  return (
    <div style={{ display: "flex", flexDirection: "column", alignItems: "center", padding: "40px 24px 24px" }}>
      <div style={{ fontSize: 56, marginBottom: 12 }}>🏥</div>
      <h1 style={{ fontSize: 26, fontWeight: 800, color: "#1e293b", marginBottom: 4 }}>CareDesk</h1>
      <p style={{ color: "#64748b", fontSize: 14, marginBottom: 32, textAlign: "center" }}>
        פלטפורמה לניהול העסקת עובד סיעוד
      </p>

      <div style={{ width: "100%" }}>
        <div className="input-group">
          <label className="input-label">אימייל</label>
          <input className="input-field" value={email} onChange={e => setEmail(e.target.value)} />
        </div>
        <div className="input-group">
          <label className="input-label">סיסמה</label>
          <input className="input-field" type="password" value={pass} onChange={e => setPass(e.target.value)} />
        </div>
        <button className="btn btn-primary btn-full" onClick={() => onNavigate("dashboard")}>
          כניסה למערכת
        </button>
        <button className="btn btn-secondary btn-full" style={{ marginTop: 8 }} onClick={() => onNavigate("empty")}>
          משתמש חדש — ראה מסך ריק
        </button>
      </div>

      <p style={{ marginTop: 24, fontSize: 12, color: "#94a3b8", textAlign: "center" }}>
        v0.4 DEMO · נתונים לדוגמה בלבד
      </p>
    </div>
  );
};

/* ════════════════════════════════════════════
   DASHBOARD SCREEN
════════════════════════════════════════════ */
const DashboardScreen = ({ onNavigate }) => (
  <div className="screen">
    <DemoBanner />
    <div className="screen-header">
      <h2>שלום, רחל 👋</h2>
      <p>מריה סנטוס — תיק #001 · פברואר 2025</p>
    </div>

    <div style={{ display: "flex", gap: 8, padding: "12px 16px" }}>
      <div className="card" style={{ flex: 1, margin: 0 }}>
        <div className="card-title">שכר הבא</div>
        <div className="card-value" style={{ fontSize: 18 }}>₪7,070</div>
        <div className="card-sub">01/03/2025</div>
      </div>
      <div className="card" style={{ flex: 1, margin: 0 }}>
        <div className="card-title">משימות פתוחות</div>
        <div className="card-value" style={{ fontSize: 18 }}>3</div>
        <div className="card-sub">2 דחופות</div>
      </div>
    </div>

    <div className="card">
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center" }}>
        <strong style={{ fontSize: 14 }}>התראות אחרונות</strong>
        <span className="badge badge-red">2 חדשות</span>
      </div>
      <div style={{ marginTop: 10, display: "flex", flexDirection: "column", gap: 8 }}>
        {[
          { icon: "🔴", text: "ויזה פגה ב-15/03/2025 — חדש דרכון", type: "red" },
          { icon: "🟡", text: "הגש ד׳׳וח חודשי לרשות האוכלוסין עד 28/02", type: "yellow" },
          { icon: "🟢", text: "שכר פברואר חושב בהצלחה", type: "green" },
        ].map((a, i) => (
          <div key={i} style={{ display: "flex", alignItems: "flex-start", gap: 8, padding: "8px 0", borderBottom: i < 2 ? "1px solid #f1f5f9" : "none" }}>
            <span>{a.icon}</span>
            <span style={{ fontSize: 13, color: "#374151" }}>{a.text}</span>
          </div>
        ))}
      </div>
    </div>

    <p className="section-title">פעולות מהירות</p>
    <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 8, padding: "0 16px" }}>
      {[
        { label: "חשב שכר", icon: "💰", nav: "payroll" },
        { label: "הוסף משימה", icon: "✅", nav: "tasks" },
        { label: "דוח שנתי", icon: "📊", nav: "annual" },
        { label: "הרשאות", icon: "🔐", nav: "permissions" },
      ].map(a => (
        <button key={a.nav} className="btn btn-secondary" style={{ padding: "14px", flexDirection: "column", gap: 4 }} onClick={() => onNavigate(a.nav)}>
          <span style={{ fontSize: 22 }}>{a.icon}</span>
          <span style={{ fontSize: 12 }}>{a.label}</span>
        </button>
      ))}
    </div>

    <BottomNav active="dashboard" onNavigate={onNavigate} />
  </div>
);

/* ════════════════════════════════════════════
   WORKER SCREEN
════════════════════════════════════════════ */
const WorkerScreen = ({ onNavigate }) => (
  <div className="screen">
    <DemoBanner />
    <div className="screen-header">
      <h2>👤 פרופיל עובד</h2>
      <p>מריה סנטוס · פיליפינית</p>
    </div>

    <div className="card">
      <div style={{ display: "flex", alignItems: "center", gap: 14, marginBottom: 14 }}>
        <div style={{ width: 56, height: 56, borderRadius: "50%", background: "linear-gradient(135deg,#1a56db,#7c3aed)", display: "flex", alignItems: "center", justifyContent: "center", fontSize: 22, color: "white" }}>מ</div>
        <div>
          <div style={{ fontSize: 18, fontWeight: 700, color: "#1e293b" }}>מריה סנטוס</div>
          <div style={{ fontSize: 13, color: "#64748b" }}>מטפלת סיעוד · B2 עברית</div>
          <span className="badge badge-green" style={{ marginTop: 4 }}>פעיל</span>
        </div>
      </div>
      <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 8 }}>
        {[
          ["ת.ז / דרכון", "P12345678"],
          ["ויזה", "B1 — פגה 15/03/25"],
          ["לאום", "פיליפינים 🇵🇭"],
          ["תחילת עבודה", "01/02/2024"],
        ].map(([k, v]) => (
          <div key={k} style={{ background: "#f8fafc", borderRadius: 10, padding: "10px 12px" }}>
            <div style={{ fontSize: 11, color: "#64748b" }}>{k}</div>
            <div style={{ fontSize: 13, fontWeight: 600, color: "#1e293b" }}>{v}</div>
          </div>
        ))}
      </div>
    </div>

    <div className="card">
      <strong style={{ fontSize: 14 }}>מסמכים</strong>
      {[
        { name: "דרכון", status: "תקף", badge: "badge-green" },
        { name: "ויזה B1", status: "פגה בקרוב", badge: "badge-yellow" },
        { name: "חוזה עבודה", status: "חתום", badge: "badge-green" },
        { name: "ביטוח בריאות", status: "חסר", badge: "badge-red" },
      ].map((d, i) => (
        <div key={i} style={{ display: "flex", justifyContent: "space-between", alignItems: "center", padding: "10px 0", borderBottom: i < 3 ? "1px solid #f1f5f9" : "none" }}>
          <span style={{ fontSize: 13, color: "#334155" }}>{d.name}</span>
          <span className={`badge ${d.badge}`}>{d.status}</span>
        </div>
      ))}
    </div>

    <BottomNav active="worker" onNavigate={onNavigate} />
  </div>
);

/* ════════════════════════════════════════════
   PAYROLL SCREEN
════════════════════════════════════════════ */
const PayrollScreen = ({ onNavigate }) => (
  <div className="screen">
    <DemoBanner />
    <div className="screen-header">
      <h2>💰 חישוב שכר</h2>
      <p>פברואר 2025</p>
    </div>

    <div className="card">
      <strong style={{ fontSize: 14, display: "block", marginBottom: 12 }}>פירוט שכר</strong>
      {[
        ["שכר מינימום", "₪5,571"],
        ["שעות נוספות", "₪892"],
        ["שבתות (4×)", "₪742"],
        ["הסעות", "₪200"],
        ["ניכוי מס", "-₪135"],
        ["ניכוי ביטוח לאומי", "-₪200"],
      ].map(([k, v]) => (
        <div key={k} style={{ display: "flex", justifyContent: "space-between", padding: "8px 0", borderBottom: "1px solid #f8fafc", fontSize: 14 }}>
          <span style={{ color: "#374151" }}>{k}</span>
          <span style={{ fontWeight: 600, color: v.startsWith("-") ? "#dc2626" : "#1e293b" }}>{v}</span>
        </div>
      ))}
      <div style={{ display: "flex", justifyContent: "space-between", padding: "12px 0 0", fontSize: 16, fontWeight: 700, borderTop: "2px solid #e2e8f0", marginTop: 4 }}>
        <span>סך לתשלום</span>
        <span style={{ color: "#1a56db" }}>₪7,070</span>
      </div>
    </div>

    <div style={{ padding: "0 16px", display: "flex", flexDirection: "column", gap: 8 }}>
      <button className="btn btn-primary btn-full" onClick={() => alert("✅ שכר אושר לתשלום!")}>אשר תשלום</button>
      <button className="btn btn-secondary btn-full" onClick={() => onNavigate("annual")}>צפה בדוח שנתי</button>
    </div>

    <BottomNav active="payroll" onNavigate={onNavigate} />
  </div>
);

/* ════════════════════════════════════════════
   TASKS SCREEN
════════════════════════════════════════════ */
const TasksScreen = ({ onNavigate }) => {
  const [tasks, setTasks] = useState([
    { id: 1, text: "חדש ויזה — מריה סנטוס", done: false, urgent: true, due: "15/03/2025" },
    { id: 2, text: "הגש ד׳׳וח לרשות האוכלוסין", done: false, urgent: true, due: "28/02/2025" },
    { id: 3, text: "חשב שכר מרץ", done: false, urgent: false, due: "01/03/2025" },
    { id: 4, text: "שלח אישור מס לרו׳׳ח", done: true, urgent: false, due: "10/02/2025" },
  ]);

  return (
    <div className="screen">
      <DemoBanner />
      <div className="screen-header">
        <h2>✅ משימות</h2>
        <p>{tasks.filter(t => !t.done).length} פתוחות · {tasks.filter(t => t.done).length} הושלמו</p>
      </div>

      <div className="card" style={{ padding: 0, overflow: "hidden" }}>
        {tasks.map(t => (
          <div key={t.id} className="list-item">
            <input type="checkbox" checked={t.done} onChange={() => setTasks(prev => prev.map(x => x.id === t.id ? { ...x, done: !x.done } : x))} style={{ width: 18, height: 18, cursor: "pointer" }} />
            <div style={{ flex: 1 }}>
              <div style={{ fontSize: 13, color: t.done ? "#94a3b8" : "#1e293b", textDecoration: t.done ? "line-through" : "none", fontWeight: 500 }}>{t.text}</div>
              <div style={{ fontSize: 11, color: "#94a3b8" }}>עד {t.due}</div>
            </div>
            {t.urgent && !t.done && <span className="badge badge-red">דחוף</span>}
          </div>
        ))}
      </div>

      <div style={{ padding: "0 16px" }}>
        <button className="btn btn-primary btn-full" onClick={() => alert("הוסף משימה — בקרוב!")}>+ הוסף משימה</button>
      </div>

      <BottomNav active="tasks" onNavigate={onNavigate} />
    </div>
  );
};

/* ════════════════════════════════════════════
   SETTINGS SCREEN
════════════════════════════════════════════ */
const SettingsScreen = ({ onNavigate }) => (
  <div className="screen">
    <DemoBanner />
    <div className="screen-header">
      <h2>⚙️ הגדרות</h2>
    </div>

    <div className="card" style={{ padding: 0, overflow: "hidden" }}>
      {[
        { icon: "📊", label: "דוח שנתי 2024", nav: "annual" },
        { icon: "🔐", label: "משתמשים והרשאות", nav: "permissions" },
        { icon: "⚖️", label: "אימות משפטי", nav: "legal" },
        { icon: "🔍", label: "סשן פעיל / Audit Log", nav: "session" },
        { icon: "📋", label: "תהליך קליטה", nav: "onboarding" },
      ].map((item, i, arr) => (
        <div key={item.nav} className="list-item" style={{ cursor: "pointer", justifyContent: "space-between" }} onClick={() => onNavigate(item.nav)}>
          <div style={{ display: "flex", alignItems: "center", gap: 12 }}>
            <span style={{ fontSize: 20 }}>{item.icon}</span>
            <span style={{ fontSize: 14, color: "#1e293b", fontWeight: 500 }}>{item.label}</span>
          </div>
          <span style={{ color: "#94a3b8" }}>›</span>
        </div>
      ))}
    </div>

    <div style={{ padding: "0 16px" }}>
      <button className="btn btn-danger btn-full" onClick={() => onNavigate("login")}>התנתק</button>
    </div>

    <BottomNav active="settings" onNavigate={onNavigate} />
  </div>
);

/* ════════════════════════════════════════════
   ONBOARDING SCREEN
════════════════════════════════════════════ */
const OnboardingScreen = ({ onNavigate }) => {
  const [step, setStep] = useState(0);
  const steps = [
    { title: "פרטי עובד", desc: "שם, ת.ז, לאום", icon: "👤" },
    { title: "מסמכים", desc: "דרכון, ויזה, חוזה", icon: "📄" },
    { title: "פרטי תשלום", desc: "בנק, שכר בסיס", icon: "💳" },
    { title: "ביטוחים", desc: "בריאות, פנסיה", icon: "🛡️" },
    { title: "סיום", desc: "אישור ויצירת תיק", icon: "✅" },
  ];

  return (
    <div className="screen">
      <DemoBanner />
      <div className="screen-header">
        <h2>📋 תהליך קליטה</h2>
        <p>שלב {step + 1} מתוך {steps.length}</p>
      </div>

      <div style={{ padding: "16px" }}>
        <div style={{ display: "flex", gap: 4, marginBottom: 20 }}>
          {steps.map((_, i) => (
            <div key={i} style={{ flex: 1, height: 4, borderRadius: 2, background: i <= step ? "#1a56db" : "#e2e8f0" }} />
          ))}
        </div>

        <div className="card" style={{ textAlign: "center", padding: 32 }}>
          <div style={{ fontSize: 48, marginBottom: 12 }}>{steps[step].icon}</div>
          <h3 style={{ fontSize: 20, fontWeight: 700, color: "#1e293b" }}>{steps[step].title}</h3>

        </div>

        <div style={{ display: "flex", gap: 8, marginTop: 12 }}>
          {step > 0 && <button className="btn btn-secondary" style={{ flex: 1 }} onClick={() => setStep(s => s - 1)}>← אחורה</button>}
          <button className="btn btn-primary" style={{ flex: 1 }} onClick={() => {
            if (step < steps.length - 1) setStep(s => s + 1);
            else { alert("🎉 תיק נפתח בהצלחה!"); onNavigate("dashboard"); }
          }}>
            {step === steps.length - 1 ? "סיים ופתח תיק" : "המשך →"}
          </button>
        </div>

        <button className="btn btn-secondary btn-full" style={{ marginTop: 8 }} onClick={() => onNavigate("dashboard")}>ביטול</button>
      </div>

      <BottomNav active="dashboard" onNavigate={onNavigate} />
    </div>
  );
};

const App = () => {
  const [screen, setScreen] = useState("login");

  const navigate = (s) => setScreen(s);

  if (screen === "login")       return <LoginScreen onNavigate={navigate} />;
  if (screen === "dashboard")   return <DashboardScreen onNavigate={navigate} />;
  if (screen === "worker")      return <WorkerScreen onNavigate={navigate} />;
  if (screen === "payroll")     return <PayrollScreen onNavigate={navigate} />;
  if (screen === "tasks")       return <TasksScreen onNavigate={navigate} />;
  if (screen === "settings")    return <SettingsScreen onNavigate={navigate} />;
  if (screen === "onboarding")  return <OnboardingScreen onNavigate={navigate} />;

  /* ── New screens ── */
  if (screen === "annual")      return <AnnualReportScreen onNavigate={navigate} />;
  if (screen === "empty")       return <EmptyStateScreen onNavigate={navigate} />;
  if (screen === "legal")       return <LegalScreen onNavigate={navigate} />;
  if (screen === "session")     return <SessionScreen onNavigate={navigate} />;
  if (screen === "permissions") return <PermissionsScreen onNavigate={navigate} />;

  return <LoginScreen onNavigate={navigate} />;
};
