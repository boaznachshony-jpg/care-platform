[extend]
useDefault = true

[allowlist]
description = """
Findings that are not credentials.

  3fcc094, 34791af — CareDesk localStorage namespaces are public browser keys.

  cff8573 — a synthetic three-segment token in upstream-probes.test.ts. The
  test it serves proves that /ready redacts anything JWT-shaped out of an
  upstream error message, so it has to feed the code something JWT-shaped;
  gitleaks cannot tell a synthetic token from a live one, and was right to
  stop it. The literal was removed in 053e27e and the value is now assembled
  at runtime from inert segments, so nothing key-shaped remains in the tree.
  The entry is here because the scan runs over history with fetch-depth: 0,
  and a commit already pushed cannot be un-scanned without rewriting the
  branch. It allowlists that one commit, not the file and not the rule.

  f55a16c — the same class as 3fcc094/34791af: a test constant named KEY
  holding the CareDesk localStorage namespace
  'caredesk.mvp.employment-expenses.v1', read by generic-api-key as a key.
  It is a public browser storage name. The constant was renamed in the next
  commit so the tree no longer matches; the commit is listed because the PR
  scan covers it and history is not rewritten (CLAUDE.md §5).
"""
commits = [
