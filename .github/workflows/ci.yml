name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main, staging]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  guardrails:
    name: Migration and architecture guardrails
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Agent coordination guard
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          test -s AGENTS.md
          test -s AGENT_STATUS.md
          grep -q '^# CareDesk Agent Coordination Protocol' AGENTS.md
          grep -q '^# CareDesk Agent Coordination Dashboard' AGENT_STATUS.md
          grep -q 'PLANNED.*ACTIVE.*BLOCKED.*IN_REVIEW.*MERGED_VERIFYING.*DONE.*CANCELLED' AGENT_STATUS.md
          grep -q '^| Workstream | Issue | Owner/Agent | Branch | PR | Status | Depends on | Parallel safe | Blocker | Next action |$' AGENT_STATUS.md

          if [ "$EVENT_NAME" = "pull_request" ]; then
            git fetch origin main --quiet
            git cat-file -e "${PR_HEAD_SHA}^{commit}"
            MAIN_SHA="$(git rev-parse origin/main)"
            MERGE_BASE="$(git merge-base "$PR_HEAD_SHA" origin/main)"
            if [ "$MERGE_BASE" != "$MAIN_SHA" ]; then
              echo "::error::Agent branch is stale. Synchronize the PR branch with the latest origin/main before merge."
              echo "PR head: $PR_HEAD_SHA"
              echo "Latest main: $MAIN_SHA"
              echo "Merge base: $MERGE_BASE"
              exit 1
            fi
          fi
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.16.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Migration safety
        run: pnpm db:migration-safety
      - name: Architecture guardrails
        run: >-
          pnpm --filter @caredesk/testing test
          src/mvp-profile-architecture.test.ts
          src/database-security-contracts.test.ts

  static:
    name: Format and lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.16.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format check
        run: pnpm format:check
      - name: Lint
        run: pnpm lint

  compile:
    name: Build and typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.16.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build workspace packages
        run: pnpm build
      - name: Typecheck
        run: pnpm typecheck

  test:
    name: Unit, integration, and accessibility tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.16.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build workspace packages
        run: pnpm build
      - name: Unit and integration tests
        run: pnpm test

  postgres-rls:
    name: PostgreSQL RLS integration
    runs-on: ubuntu-latest
    needs: guardrails
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: caredesk
          POSTGRES_PASSWORD: caredesk
          POSTGRES_DB: caredesk_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U caredesk -d caredesk_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_ADMIN_URL: postgresql://caredesk:caredesk@127.0.0.1:5432/caredesk_test?sslmode=disable
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.16.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Run migrations and RLS security integration tests
        run: pnpm --filter @caredesk/db rls-test:ci

  e2e:
    name: Playwright end-to-end
    runs-on: ubuntu-latest
    needs: guardrails
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.16.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build workspace packages
        run: pnpm build
      - name: Install Chromium
        run: pnpm --filter @caredesk/web exec playwright install --with-deps chromium
      - name: Run end-to-end tests
        run: pnpm --filter @caredesk/web test:e2e
      - name: Upload Playwright report and failure evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report
            apps/web/test-results
          if-no-files-found: ignore
          retention-days: 14

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  required-quality-gates:
    name: Format, lint, typecheck, test, build
    if: ${{ always() }}
    needs:
      - guardrails
      - static
      - compile
      - test
      - postgres-rls
      - e2e
      - secret-scan
    runs-on: ubuntu-latest
    steps:
      - name: Require every quality gate to succeed
        env:
          GUARDRAILS_RESULT: ${{ needs.guardrails.result }}
          STATIC_RESULT: ${{ needs.static.result }}
          COMPILE_RESULT: ${{ needs.compile.result }}
          TEST_RESULT: ${{ needs.test.result }}
          POSTGRES_RLS_RESULT: ${{ needs.postgres-rls.result }}
          E2E_RESULT: ${{ needs.e2e.result }}
          SECRET_SCAN_RESULT: ${{ needs.secret-scan.result }}
        run: |
          test "$GUARDRAILS_RESULT" = success
          test "$STATIC_RESULT" = success
          test "$COMPILE_RESULT" = success
          test "$TEST_RESULT" = success
          test "$POSTGRES_RLS_RESULT" = success
          test "$E2E_RESULT" = success
          test "$SECRET_SCAN_RESULT" = success

  notify-pipedream:
    name: Report final CI result to Pipedream
    if: ${{ always() }}
    needs: required-quality-gates
    runs-on: ubuntu-latest
    steps:
      - name: Send failure-isolated CI notification
        env:
          PIPEDREAM_CI_WEBHOOK_URL: ${{ secrets.PIPEDREAM_CI_WEBHOOK_URL }}
          PIPEDREAM_CI_TOKEN: ${{ secrets.PIPEDREAM_CI_TOKEN }}
          CI_CONCLUSION: ${{ needs.required-quality-gates.result }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set +e

          case "$PIPEDREAM_CI_WEBHOOK_URL" in
            https://*) ;;
            *)
              echo "::warning::Pipedream CI notification skipped because its HTTPS configuration is unavailable."
              exit 0
              ;;
          esac

          if [ -z "$PIPEDREAM_CI_TOKEN" ]; then
            echo "::warning::Pipedream CI notification skipped because its authentication configuration is unavailable."
            exit 0
          fi

          payload="$(jq -n \
            --arg repository "$GITHUB_REPOSITORY" \
            --arg workflow "$GITHUB_WORKFLOW" \
            --arg run_id "$GITHUB_RUN_ID" \
            --arg run_attempt "$RUN_ATTEMPT" \
            --arg ref "$GITHUB_REF" \
            --arg sha "$GITHUB_SHA" \
            --arg event_name "$GITHUB_EVENT_NAME" \
            --arg actor "$GITHUB_ACTOR" \
            --arg conclusion "$CI_CONCLUSION" \
            --arg run_url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            --arg timestamp "$(date -u +'%Y-%m-%dT%H:%M:%SZ')" \
            '{
              repository: $repository,
              workflow: $workflow,
              run_id: $run_id,
              run_attempt: $run_attempt,
              ref: $ref,
              sha: $sha,
              event_name: $event_name,
              actor: $actor,
              conclusion: $conclusion,
              run_url: $run_url,
              timestamp: $timestamp
            }')"

          curl --silent \
            --fail \
            --output /dev/null \
            --max-time 10 \
            --request POST \
            --header "Authorization: Bearer $PIPEDREAM_CI_TOKEN" \
            --header "Content-Type: application/json" \
            --data "$payload" \
            "$PIPEDREAM_CI_WEBHOOK_URL" \
            2>/dev/null

          if [ "$?" -ne 0 ]; then
            echo "::warning::Pipedream CI notification failed without affecting CI."
          fi

          exit 0
